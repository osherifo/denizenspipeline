[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmriflow"
version = "2.0.0a4"
description = "fMRIflow — Module-based neuroscience encoding model pipeline"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "rich>=13.0",
    # Preprocessing pipelines are nipype workflows (fmriprep runs as a node).
    "nipype>=1.8",
]

[project.optional-dependencies]
cloud = ["cottoncandy>=0.2", "boto3>=1.26"]
viz = ["pycortex>=1.2", "matplotlib>=3.7"]
ml = ["scikit-learn>=1.2"]
himalaya = ["himalaya>=0.4", "scikit-learn>=1.2"]
nlp = ["transformers>=4.28", "gensim>=4.3"]
audio = ["librosa>=0.10", "soundfile>=0.12"]
video = ["opencv-python>=4.7"]
bids = ["nibabel>=5.0"]
# BIOPAC .acq reading for the physio-correction nodes.
physio = ["bioread>=3.0"]
flatten = ["autoflatten>=0.1.0"]
frontend = ["fastapi>=0.109", "uvicorn>=0.27", "websockets>=12.0", "python-multipart>=0.0.7"]
# Artifact hub: OS-keyring token storage (optional — falls back to
# settings.json / env var when absent). git/git-lfs are external tools.
hub = ["keyring>=24"]
all = ["fmriflow[cloud,viz,ml,nlp,himalaya,audio,video,bids,physio,frontend,flatten]"]
dev = ["fmriflow[all]", "pytest>=7.3", "pytest-cov>=4.1", "h5py>=3.8"]

[project.scripts]
fmriflow = "fmriflow.cli:main"

# Built-in analysis modules are registered by
# fmriflow.modules.register_builtins(). Third-party packages can add modules
# through the entry-point groups fmriflow.stimulus_loaders,
# fmriflow.response_loaders, fmriflow.feature_extractors, fmriflow.models,
# fmriflow.reporters, ... (see docs/guide/modules.md); a name already taken by
# a built-in is ignored.

[tool.hatch.build.targets.wheel]
packages = ["fmriflow"]

# The frontend bundle, bundled built-ins, and hub schema all live
# inside the packaged tree, so hatch's default selection picks them
# up. They must NOT be force-included as well — force-include emits
# a second copy at the same archive path, which hatch rejects.
# Instead, mark them as artifacts so a VCS-ignored build context
# (docker, where .dockerignore drops server/static) still keeps them.
artifacts = [
    "fmriflow/server/static/**",
    "fmriflow/server/docs_site/**",
    "fmriflow/builtin/**",
    "fmriflow/hub/hub.schema.json",
]
