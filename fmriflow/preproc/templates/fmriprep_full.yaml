schema_version: 1
name: fmriprep_full
description: fmriprep, anatomical + functional, outputs in T1w space. The default quick path.
inputs:
  bids_dir: {kind: dir, description: BIDS root}
  subject: {kind: str, description: participant label}
  output_dir: {kind: dir, description: derivatives root}
nodes:
  - id: fmriprep
    type: fmriprep
    kind: container_app
    data:
      params: {mode: full, output_spaces: [T1w]}
      bindings: {bids_dir: $inputs.bids_dir, subject: $inputs.subject, output_dir: $inputs.output_dir}
    position: {x: 0, y: 0}
edges: []
manifest: {backend_node: fmriprep}
