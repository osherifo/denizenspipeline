schema_version: 1
name: fmriprep_func_precomputed_anat
description: fmriprep functional preprocessing reusing an existing FreeSurfer subjects dir.
inputs:
  bids_dir: {kind: dir, description: BIDS root}
  subject: {kind: str, description: participant label}
  output_dir: {kind: dir, description: derivatives root}
  work_dir: {kind: dir, description: fmriprep work dir}
  fs_subjects_dir: {kind: dir, description: precomputed FreeSurfer SUBJECTS_DIR}
nodes:
  - id: fmriprep
    type: fmriprep
    kind: container_app
    data:
      params: {mode: func_precomputed_anat, output_spaces: [T1w]}
      bindings:
        bids_dir: $inputs.bids_dir
        subject: $inputs.subject
        output_dir: $inputs.output_dir
        work_dir: $inputs.work_dir
        fs_subjects_dir: $inputs.fs_subjects_dir
    position: {x: 0, y: 0}
edges: []
manifest: {backend_node: fmriprep}
